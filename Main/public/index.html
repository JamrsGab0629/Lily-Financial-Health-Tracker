<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lily — Financial Health Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/landing.css">
<!-- Add landing.css here once that page exists, e.g.: <link rel="stylesheet" href="css/landing.css"> -->
<script>
  // Apply saved theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem('lily-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- ============ LOADING SCREEN (persistent, only shown on first load) ============ -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-screen__avatar">
    <img src="assets/happy.gif" alt="" class="loading-screen__img">
  </div>
  <p class="loading-screen__brand">Lily</p>
  <p class="loading-screen__status" id="loadingStatus">Waking Lily up…</p>
  <div class="loading-screen__bar">
    <div class="loading-screen__bar-fill"></div>
  </div>
</div>

<!-- ============ HEADER (persistent across all routes) ============ -->
<header class="app-header">
  <a href="#/" class="brand" data-route="/">
    <span class="brand-mark" aria-hidden="true">
      <img src="assets/happy.gif" alt="" class="brand-mark__img">
    </span>
    <span class="brand-text">
      <span class="brand-name">Lily</span>
      <span class="brand-tagline">Financial Health Tracker</span>
    </span>
  </a>

  <div class="header-right">
    <nav class="main-nav" aria-label="Primary" id="mainNav">
      <a href="#/dashboard" class="nav-link" data-route="/dashboard">Dashboard</a>
      <a href="#/chat" class="nav-link" data-route="/chat">Chat</a>
    </nav>

    <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode">
      <span class="theme-toggle__thumb" id="themeToggleIcon" aria-hidden="true">☀️</span>
    </button>
  </div>
</header>

<!-- ============ ROUTED CONTENT MOUNTS HERE ============ -->
<div id="appRoot" class="app-root"></div>

<script src="js/theme.js"></script>
<script src="js/loading.js"></script>
<script src="js/router.js"></script>
</body>
</html>
